<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Monitor Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 20px 0 30px;
    }

    header h1 {
      font-size: 28px;
      color: #38bdf8;
      letter-spacing: 1px;
    }

    header p {
      color: #64748b;
      margin-top: 6px;
      font-size: 14px;
    }

    #last-updated {
      color: #22c55e;
      font-size: 13px;
      margin-top: 4px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto 40px;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      border: 1px solid #334155;
    }

    .card h3 {
      font-size: 13px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .gauge-wrap {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 12px;
    }

    .gauge-wrap svg {
      transform: rotate(-90deg);
    }

    .gauge-bg {
      fill: none;
      stroke: #334155;
      stroke-width: 10;
    }

    .gauge-fill {
      fill: none;
      stroke-width: 10;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s ease;
    }

    .gauge-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 22px;
      font-weight: bold;
    }

    .card-value {
      font-size: 15px;
      color: #cbd5e1;
      margin-top: 4px;
    }

    /* Colors */
    .cpu .gauge-fill  { stroke: #38bdf8; }
    .cpu .gauge-text  { color: #38bdf8; }
    .ram .gauge-fill  { stroke: #a78bfa; }
    .ram .gauge-text  { color: #a78bfa; }
    .disk .gauge-fill { stroke: #34d399; }
    .disk .gauge-text { color: #34d399; }

    .uptime-card {
      background: #1e293b;
      border-radius: 16px;
      padding: 20px 24px;
      text-align: center;
      border: 1px solid #334155;
    }

    .uptime-card h3 {
      font-size: 13px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .uptime-card .uptime-val {
      font-size: 26px;
      color: #fbbf24;
      font-weight: bold;
    }

    /* History Table */
    .history {
      max-width: 1000px;
      margin: 0 auto;
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #334155;
    }

    .history h2 {
      font-size: 16px;
      color: #94a3b8;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th {
      color: #64748b;
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1px solid #334155;
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid #1e293b;
      color: #cbd5e1;
    }

    tr:hover td { background: #0f172a; }

    .status-ok {
      display: inline-block;
      background: #14532d;
      color: #22c55e;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 12px;
    }
  </style>
</head>
<body>

<header>
  <h1>Server Monitor Dashboard</h1>
  <p id="hostname">Loading...</p>
  <p id="last-updated">Fetching data...</p>
</header>

<!-- Gauge Cards -->
<div class="cards">
  <div class="card cpu">
    <h3>CPU Usage</h3>
    <div class="gauge-wrap">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle class="gauge-bg" cx="60" cy="60" r="50"/>
        <circle class="gauge-fill" id="cpu-gauge" cx="60" cy="60" r="50"
          stroke-dasharray="314"
          stroke-dashoffset="314"/>
      </svg>
      <div class="gauge-text" id="cpu-text">0%</div>
    </div>
  </div>

  <div class="card ram">
    <h3>RAM Usage</h3>
    <div class="gauge-wrap">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle class="gauge-bg" cx="60" cy="60" r="50"/>
        <circle class="gauge-fill" id="ram-gauge" cx="60" cy="60" r="50"
          stroke-dasharray="314"
          stroke-dashoffset="314"/>
      </svg>
      <div class="gauge-text" id="ram-text">0%</div>
    </div>
  </div>

  <div class="card disk">
    <h3>Disk Usage</h3>
    <div class="gauge-wrap">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle class="gauge-bg" cx="60" cy="60" r="50"/>
        <circle class="gauge-fill" id="disk-gauge" cx="60" cy="60" r="50"
          stroke-dasharray="314"
          stroke-dashoffset="314"/>
      </svg>
      <div class="gauge-text" id="disk-text">0%</div>
    </div>
  </div>

  <div class="uptime-card">
    <h3>Uptime</h3>
    <div class="uptime-val" id="uptime-text">--</div>
  </div>
</div>

<!-- History Table -->
<div class="history">
  <h2>Recent History</h2>
  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>CPU</th>
        <th>RAM</th>
        <th>Disk</th>
        <th>Uptime</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="history-body">
      <tr><td colspan="6" style="color:#64748b">Loading...</td></tr>
    </tbody>
  </table>
</div>

<script>
  const API = 'https://monitor-api-e8ez.onrender.com/api.php';

  function setGauge(id, percent) {
    const circumference = 314;
    const offset = circumference - (percent / 100) * circumference;
    document.getElementById(id + '-gauge').style.strokeDashoffset = offset;
    document.getElementById(id + '-text').textContent = percent.toFixed(1) + '%';
  }

  function fetchData() {
    fetch(API)
      .then(r => r.json())
      .then(data => {
        if (!data.length) return;

        const latest = data[0];

        // Update gauges
        setGauge('cpu',  parseFloat(latest.cpu_percent));
        setGauge('ram',  parseFloat(latest.ram_percent));
        setGauge('disk', parseFloat(latest.disk_percent));

        // Uptime + hostname
        document.getElementById('uptime-text').textContent = latest.uptime;
        document.getElementById('hostname').textContent = '🖥️ ' + latest.hostname;
        document.getElementById('last-updated').textContent =
          'Last updated: ' + latest.recorded_at.replace('T', ' ');

        // History table
        const tbody = document.getElementById('history-body');
        tbody.innerHTML = '';
        data.forEach(row => {
          tbody.innerHTML += `
            <tr>
              <td>${row.recorded_at.slice(0, 19).replace('T',' ')}</td>
              <td>${parseFloat(row.cpu_percent).toFixed(1)}%</td>
              <td>${parseFloat(row.ram_percent).toFixed(1)}%</td>
              <td>${parseFloat(row.disk_percent).toFixed(1)}%</td>
              <td>${row.uptime}</td>
              <td><span class="status-ok">OK</span></td>
            </tr>`;
        });
      })
      .catch(err => {
        document.getElementById('last-updated').textContent = 'Error fetching data';
      });
  }

  // Load immediately + har 60 second mein refresh
  fetchData();
  setInterval(fetchData, 60000);
</script>

</body>
</html>
