<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Monitor Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 16px;
    }

    header {
      text-align: center;
      padding: 16px 0 20px;
    }

    header h1 {
      font-size: 22px;
      color: #38bdf8;
      letter-spacing: 1px;
    }

    header p {
      color: #64748b;
      margin-top: 6px;
      font-size: 13px;
    }

    #last-updated { color: #22c55e; font-size: 12px; margin-top: 4px; }

    #server-status {
      margin-top: 8px;
      font-size: 15px;
      font-weight: bold;
    }

    /* Offline Banner */
    #offline-banner {
      display: none;
      background: #7f1d1d;
      border: 1px solid #ef4444;
      color: #fca5a5;
      text-align: center;
      padding: 12px 20px;
      border-radius: 10px;
      margin: 0 auto 20px;
      max-width: 1000px;
      font-size: 14px;
    }

    #offline-banner .banner-title {
      font-size: 17px;
      font-weight: bold;
      color: #ef4444;
      margin-bottom: 4px;
    }

    /* Cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 1000px;
      margin: 0 auto 24px;
    }

    @media (min-width: 640px) {
      .cards { grid-template-columns: repeat(4, 1fr); gap: 20px; }
      header h1 { font-size: 28px; }
    }

    .card {
      background: #1e293b;
      border-radius: 14px;
      padding: 16px 12px;
      text-align: center;
      border: 1px solid #334155;
    }

    .card h3 {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .gauge-wrap {
      position: relative;
      width: 90px;
      height: 90px;
      margin: 0 auto 8px;
    }

    @media (min-width: 640px) {
      .gauge-wrap { width: 110px; height: 110px; }
    }

    .gauge-wrap svg { transform: rotate(-90deg); }

    .gauge-bg {
      fill: none;
      stroke: #334155;
      stroke-width: 9;
    }

    .gauge-fill {
      fill: none;
      stroke-width: 9;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s ease, stroke 0.5s ease;
    }

    .gauge-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      font-weight: bold;
      transition: color 0.5s ease;
    }

    @media (min-width: 640px) {
      .gauge-text { font-size: 22px; }
    }

    .uptime-card {
      background: #1e293b;
      border-radius: 14px;
      padding: 16px 12px;
      text-align: center;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .uptime-card h3 {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .uptime-val {
      font-size: 18px;
      color: #fbbf24;
      font-weight: bold;
      line-height: 1.3;
    }

    @media (min-width: 640px) {
      .uptime-val { font-size: 22px; }
    }

    /* History */
    .history {
      max-width: 1000px;
      margin: 0 auto;
      background: #1e293b;
      border-radius: 14px;
      padding: 16px;
      border: 1px solid #334155;
      overflow-x: auto;
    }

    .history h2 {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 380px;
    }

    th {
      color: #64748b;
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid #334155;
      font-size: 12px;
    }

    td {
      padding: 9px 10px;
      border-bottom: 1px solid #263148;
      color: #cbd5e1;
    }

    tr:hover td { background: #0f172a; }

    .status-ok {
      display: inline-block;
      background: #14532d;
      color: #22c55e;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
    }
  </style>
</head>
<body>

<header>
  <h1>Server Monitor Dashboard</h1>
  <p id="hostname">Loading...</p>
  <p id="last-updated">Fetching data...</p>
  <p id="server-status"></p>
</header>

<!-- Offline Banner -->
<div id="offline-banner">
  <div class="banner-title">⚠️ SERVER OFFLINE</div>
  <div id="last-seen-text">Last seen: --</div>
</div>

<!-- Gauge Cards -->
<div class="cards">
  <div class="card">
    <h3>CPU Usage</h3>
    <div class="gauge-wrap">
      <svg width="100%" height="100%" viewBox="0 0 110 110">
        <circle class="gauge-bg" cx="55" cy="55" r="46"/>
        <circle class="gauge-fill" id="cpu-gauge" cx="55" cy="55" r="46"
          stroke-dasharray="289" stroke-dashoffset="289" stroke="#22c55e"/>
      </svg>
      <div class="gauge-text" id="cpu-text">0%</div>
    </div>
  </div>

  <div class="card">
    <h3>RAM Usage</h3>
    <div class="gauge-wrap">
      <svg width="100%" height="100%" viewBox="0 0 110 110">
        <circle class="gauge-bg" cx="55" cy="55" r="46"/>
        <circle class="gauge-fill" id="ram-gauge" cx="55" cy="55" r="46"
          stroke-dasharray="289" stroke-dashoffset="289" stroke="#22c55e"/>
      </svg>
      <div class="gauge-text" id="ram-text">0%</div>
    </div>
  </div>

  <div class="card">
    <h3>Disk Usage</h3>
    <div class="gauge-wrap">
      <svg width="100%" height="100%" viewBox="0 0 110 110">
        <circle class="gauge-bg" cx="55" cy="55" r="46"/>
        <circle class="gauge-fill" id="disk-gauge" cx="55" cy="55" r="46"
          stroke-dasharray="289" stroke-dashoffset="289" stroke="#22c55e"/>
      </svg>
      <div class="gauge-text" id="disk-text">0%</div>
    </div>
  </div>

  <div class="uptime-card">
    <h3>Uptime</h3>
    <div class="uptime-val" id="uptime-text">--</div>
  </div>
</div>

<!-- History Table -->
<div class="history">
  <h2>Recent History</h2>
  <table>
    <thead>
      <tr>
        <th>Time (IST)</th>
        <th>CPU</th>
        <th>RAM</th>
        <th>Disk</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="history-body">
      <tr><td colspan="5" style="color:#64748b;text-align:center">Loading...</td></tr>
    </tbody>
  </table>
</div>

<script>
  const API  = 'https://monitor-api-e8ez.onrender.com/api.php';
  const CIRC = 289;

  function toIST(utcStr) {
    const d = new Date(utcStr.replace(' ', 'T') + 'Z');
    return d.toLocaleString('en-IN', {
      timeZone: 'Asia/Kolkata',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      hour12: false
    });
  }

  function getColor(pct) {
    if (pct >= 80) return '#ef4444';
    if (pct >= 60) return '#facc15';
    return '#22c55e';
  }

  function setGauge(id, percent) {
    const offset = CIRC - (percent / 100) * CIRC;
    const color  = getColor(percent);
    document.getElementById(id + '-gauge').style.strokeDashoffset = offset;
    document.getElementById(id + '-gauge').style.stroke = color;
    document.getElementById(id + '-text').textContent  = percent.toFixed(1) + '%';
    document.getElementById(id + '-text').style.color  = color;
  }

  function fetchData() {
    fetch(API)
      .then(r => r.json())
      .then(data => {
        if (!data.length) return;
        const latest = data[0];

        setGauge('cpu',  parseFloat(latest.cpu_percent));
        setGauge('ram',  parseFloat(latest.ram_percent));
        setGauge('disk', parseFloat(latest.disk_percent));

        document.getElementById('uptime-text').textContent = latest.uptime;
        document.getElementById('hostname').textContent    = '🖥️ ' + latest.hostname;
        document.getElementById('last-updated').textContent =
          'Last updated: ' + toIST(latest.recorded_at) + ' IST';

        // Online / Offline check
        const lastTime    = new Date(latest.recorded_at.replace(' ', 'T') + 'Z');
        const diffMinutes = (new Date() - lastTime) / 1000 / 60;
        const statusEl    = document.getElementById('server-status');
        const banner      = document.getElementById('offline-banner');
        const lastSeen    = document.getElementById('last-seen-text');

        if (diffMinutes > 10) {
          statusEl.textContent   = '🔴 Server Offline';
          statusEl.style.color   = '#ef4444';
          banner.style.display   = 'block';
          lastSeen.textContent   = 'Last seen: ' + Math.round(diffMinutes) +
            ' minutes ago — ' + toIST(latest.recorded_at) + ' IST';
        } else {
          statusEl.textContent   = '🟢 Server Online';
          statusEl.style.color   = '#22c55e';
          banner.style.display   = 'none';
        }

        // History table
        const tbody = document.getElementById('history-body');
        tbody.innerHTML = '';
        data.forEach(row => {
          const cpu  = parseFloat(row.cpu_percent);
          const ram  = parseFloat(row.ram_percent);
          const disk = parseFloat(row.disk_percent);
          tbody.innerHTML += `
            <tr>
              <td>${toIST(row.recorded_at)}</td>
              <td style="color:${getColor(cpu)}">${cpu.toFixed(1)}%</td>
              <td style="color:${getColor(ram)}">${ram.toFixed(1)}%</td>
              <td style="color:${getColor(disk)}">${disk.toFixed(1)}%</td>
              <td><span class="status-ok">OK</span></td>
            </tr>`;
        });
      })
      .catch(() => {
        document.getElementById('last-updated').textContent  = 'Error fetching data';
        document.getElementById('server-status').textContent = '🔴 Server Offline';
        document.getElementById('server-status').style.color = '#ef4444';
        document.getElementById('offline-banner').style.display = 'block';
        document.getElementById('last-seen-text').textContent  = 'Unable to reach API';
      });
  }

  fetchData();
  setInterval(fetchData, 60000);
</script>

</body>
</html>
